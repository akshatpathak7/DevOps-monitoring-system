name: themisto-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://monitor:test-only-password@postgres-test:5432/monitor_test
    depends_on:
      postgres-test:
        condition: service_healthy
